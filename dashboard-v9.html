function weekdayFullName(iso) { return weekdayFull[(new Date(iso + "T00:00:00").getDay() + 6) % 7]; }
function timeToMinutes(t) { if (!t) return 0; const [h, m] = t.split(":").map(Number); return h * 60 + m; }
function minutesToTime(mins) { const h = Math.floor(mins / 60).toString().padStart(2, "0"); const m = (mins % 60).toString().padStart(2, "0"); return `${h}:${m}`; }
function hhmm(t) { return t ? t.slice(0, 5) : "—"; }
function daysSince(iso) { const a = new Date(iso + "T00:00:00"); const b = new Date(todayIso() + "T00:00:00"); return Math.round((b - a) / 86400000); }
function initialsOf(name) { return (name || "?").split(" ").map(p => p[0]).filter(Boolean).join("").slice(0, 2).toUpperCase(); }

function useSupabaseData(reloadKey) {
  const [state, setState] = useState({ loading: true, error: null, salon: null, settings: null, services: [], staff: [], bookings: [], clients: [], winback: [] });

  const load = useCallback(async () => {
    setState(s => ({ ...s, loading: true, error: null }));
    try {
      const [salonRes, settingsRes, servicesRes, staffRes, bookingsRes, clientsRes, winbackRes] = await Promise.all([
        sb.from('salons').select('*').eq('id', SALON_ID).maybeSingle(),
        sb.from('salon_settings').select('*').eq('salon_id', SALON_ID).maybeSingle(),
        sb.from('services').select('*').eq('salon_id', SALON_ID).order('name'),
        sb.from('staff').select('*').eq('salon_id', SALON_ID).order('created_at'),
        sb.from('bookings').select('*').eq('salon_id', SALON_ID).order('date').order('time'),
        sb.from('clients').select('*').eq('salon_id', SALON_ID).order('name'),
        sb.from('client_last_visit').select('*').eq('salon_id', SALON_ID),
      ]);
      const firstErr = [salonRes, settingsRes, servicesRes, staffRes, bookingsRes, clientsRes, winbackRes].find(r => r.error);
      if (firstErr) throw firstErr.error;
      setState({
        loading: false, error: null,
        salon: salonRes.data,
        settings: settingsRes.data,
        services: servicesRes.data || [],
        staff: staffRes.data || [],
        bookings: bookingsRes.data || [],
        clients: clientsRes.data || [],
        winback: winbackRes.data || [],
      });
    } catch (e) {
      setState(s => ({ ...s, loading: false, error: e.message || String(e) }));
    }
  }, []);

  useEffect(() => { load(); }, [load, reloadKey]);
  return { ...state, reload: load };
}

function Toggle({ checked, onChange }) {

    <label className="toggle">
      <input type="checkbox" checked={checked} onChange={onChange} />
      <span className="toggle-track"><span className="toggle-thumb" /></span>

function Banner({ error, ok, onClear }) {
  if (!error && !ok) return null;
  return <div className={"banner " + (error ? "error" : "ok")} onClick={onClear} style={{ cursor: "pointer" }}>
    {error ? ("Помилка: " + error) : ok} {" "}<span style={{ opacity: 0.6 }}>(натисніть, щоб приховати)</span>
  </div>;
}

function ClientAutocomplete({ clients, value, onChange, onPick }) {
  const [open, setOpen] = useState(false);
  const matches = useMemo(() => {
    if (!value || value.length < 1) return [];
    const q = value.toLowerCase();
    return clients.filter(c => (c.name || "").toLowerCase().includes(q)).slice(0, 6);
  }, [value, clients]);
  return (
    <div className="autocomplete">
      <input
        value={value}
        placeholder="Ім'я клієнтки"
        onChange={e => { onChange(e.target.value); setOpen(true); }}
        onFocus={() => setOpen(true)}
        onBlur={() => setTimeout(() => setOpen(false), 150)}
      />
      {open && matches.length > 0 && (
        <div className="autocomplete-list">
          {matches.map(c => (
            <div key={c.id} className="autocomplete-item" onMouseDown={() => { onPick(c); setOpen(false); }}>
              {c.name}{c.phone ? " · " + c.phone : ""}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function CalendarView({ data, notify }) {
  const { services, staff, bookings, clients } = data;
  const [selectedDate, setSelectedDate] = useState(todayIso());
  const [showBookingForm, setShowBookingForm] = useState(false);
  const [detailId, setDetailId] = useState(null);
  const [confirmCancelId, setConfirmCancelId] = useState(null);
  const [detailDuration, setDetailDuration] = useState("");
  const [saving, setSaving] = useState(false);

  const activeStaff = staff.filter(s => s.active !== false);
  const soloMode = activeStaff.length <= 1;

  const weekStrip = Array.from({ length: 7 }, (_, i) => addDays(selectedDate, i - 2));
  const dayBookings = bookings
    .filter(b => b.date === selectedDate && !CANCELLED_STATUSES.includes(b.status))
    .sort((a, b) => timeToMinutes(a.time) - timeToMinutes(b.time));

  function enrich(b) {
    const client = clients.find(c => c.id === b.client_id);
    const service = services.find(s => s.id === b.service_id);
    return { ...b, clientName: client ? client.name : "Клієнт(ка)", serviceName: service ? service.name : "—" };
  }

  async function updateDuration(bookingId, minutes) {
    setSaving(true);
    const { error } = await sb.from('bookings').update({ duration_minutes: Number(minutes) }).eq('id', bookingId);
    setSaving(false);
    if (error) return notify(error.message, true);
    notify("Тривалість оновлено");
    data.reload();
  }

  async function cancelBooking(bookingId) {
    setSaving(true);
    const { error } = await sb.from('bookings').update({ status: 'cancelled' }).eq('id', bookingId);
    setSaving(false);
    if (error) return notify(error.message, true);
    setDetailId(null); setConfirmCancelId(null);
    notify("Запис скасовано, вікно вільне");
    data.reload();
  }

  const detailBooking = detailId ? enrich(dayBookings.find(b => b.id === detailId) || {}) : null;

  return (
    <div className="main">
      <div className="cal-toolbar">
        <div className="cal-nav">
          <button onClick={() => setSelectedDate(addDays(selectedDate, -1))}>‹</button>
          <div className="cal-title">{formatDate(selectedDate)}</div>
          <button onClick={() => setSelectedDate(addDays(selectedDate, 1))}>›</button>
        </div>
        <button className="btn-primary" onClick={() => setShowBookingForm(true)}>+ Запис вручну</button>
      </div>

      <div className="week-strip">
        {weekStrip.map(d => (
          <button key={d} className={"day-btn" + (d === selectedDate ? " active" : "")} onClick={() => setSelectedDate(d)}>
            <span className="wd">{weekdayLabel(d)}</span>
            <span className="num">{dayNum(d)}</span>
          </button>
        ))}
      </div>

      {soloMode ? (
        <>
          {dayBookings.length === 0 && <div className="empty">На цей день ще немає записів.</div>}
          {dayBookings.map(b => {
            const e = enrich(b);
            return (
              <div className="booking" key={b.id} onClick={() => { setDetailId(b.id); setDetailDuration(String(b.duration_minutes || 60)); }}>
                <div className="booking-time"><span className="t">{hhmm(b.time)}</span><span className="dur">{b.duration_minutes} хв</span></div>
                <div className="booking-line" />
                <div className="booking-info"><div className="booking-client">{e.clientName}</div><div className="booking-service">{e.serviceName}</div></div>
                <span className={"badge " + (b.source || "manual")}>{b.source === "bot" ? "від бота" : "вручну"}</span>
              </div>
            );
          })}
        </>
      ) : (
        <div className="staff-columns">
          {activeStaff.map(s => {
            const staffBookings = dayBookings.filter(b => b.staff_id === s.id);
            return (
              <div className="staff-column" key={s.id}>
                <div className="staff-col-head" style={{ borderColor: s.color || "var(--gold-1)" }}>
                  <span className="staff-dot" style={{ background: s.color || "var(--gold-1)" }} />{s.name}
                </div>
                {staffBookings.length === 0 && <div className="empty" style={{ padding: "18px 0" }}>Немає записів</div>}
                {staffBookings.map(b => {
                  const e = enrich(b);
                  return (
                    <div className="booking" key={b.id} style={{ borderLeft: "3px solid " + (s.color || "var(--gold-1)") }} onClick={() => { setDetailId(b.id); setDetailDuration(String(b.duration_minutes || 60)); }}>
                      <div className="booking-time"><span className="t">{hhmm(b.time)}</span><span className="dur">{b.duration_minutes} хв</span></div>
                      <div className="booking-info"><div className="booking-client">{e.clientName}</div><div className="booking-service">{e.serviceName}</div></div>
                    </div>
                  );
                })}
              </div>
            );
          })}
        </div>
      )}

      {detailBooking && (() => {
        const sameGroup = dayBookings.filter(b => soloMode || b.staff_id === detailBooking.staff_id).sort((a, b) => timeToMinutes(a.time) - timeToMinutes(b.time));
        const idx = sameGroup.findIndex(b => b.id === detailBooking.id);
        const next = sameGroup[idx + 1];
        const currentEnd = timeToMinutes(detailBooking.time) + (Number(detailDuration) || detailBooking.duration_minutes);
        const gapMinutes = next ? timeToMinutes(next.time) - currentEnd : null;
        return (
          <div className="overlay" onClick={() => setDetailId(null)}>
            <div className="modal" onClick={e => e.stopPropagation()}>
              <div className="modal-head"><h3>{detailBooking.clientName}</h3><button className="close" onClick={() => setDetailId(null)}>✕</button></div>
              <div className="field"><label className="field-label">Послуга</label><input value={detailBooking.serviceName} disabled /></div>
              <div className="row2">
                <div className="field"><label className="field-label">Час</label><input value={hhmm(detailBooking.time)} disabled /></div>
                <div className="field"><label className="field-label">Тривалість, хв</label><input type="number" step="5" value={detailDuration} onChange={e => setDetailDuration(e.target.value)} /></div>
              </div>
              <div className="modal-actions">
                <button className="btn-secondary" onClick={() => setDetailDuration(String(detailBooking.duration_minutes))}>Скинути</button>
                <button className="btn-primary" disabled={saving} onClick={() => updateDuration(detailBooking.id, detailDuration)}>Зберегти</button>
              </div>
              {next ? (
                gapMinutes > 0 ? (
                  <div className="gap-note">Вільно {gapMinutes} хв до "{enrich(next).clientName}" ({hhmm(next.time)})</div>
                ) : (
                  <div className="gap-note" style={{ borderColor: "var(--line)", color: "var(--ink-dim)" }}>Проміжку немає — впритул до наступного запису</div>
                )
              ) : (
                <div className="gap-note">Далі вільно до кінця робочого дня</div>
              )}
              {confirmCancelId === detailBooking.id ? (
                <div className="cancel-box">
                  <div>Скасувати цей запис? Вікно стане вільним.</div>
                  <div className="modal-actions">
                    <button className="btn-secondary" onClick={() => setConfirmCancelId(null)}>Ні, залишити</button>
                    <button className="btn-danger" disabled={saving} onClick={() => cancelBooking(detailBooking.id)}>Так, скасувати</button>
                  </div>
                </div>
              ) : (
                <button className="btn-danger" style={{ width: "100%", marginTop: 14 }} onClick={() => setConfirmCancelId(detailBooking.id)}>Скасувати запис</button>
              )}
            </div>
          </div>
        );
      })()}

      {showBookingForm && (
        <ManualBookingModal
          selectedDate={selectedDate}
          services={services}
          staff={activeStaff}
          soloMode={soloMode}
          clients={clients}
          onClose={() => setShowBookingForm(false)}
          onSaved={() => { setShowBookingForm(false); notify("Запис додано"); data.reload(); }}
          notify={notify}
        />
      )}
    </div>
  );
}

function ManualBookingModal({ selectedDate, services, staff, soloMode, clients, onClose, onSaved, notify }) {
  const [clientName, setClientName] = useState("");
  const [clientId, setClientId] = useState(null);
  const [items, setItems] = useState(services[0] ? [{ serviceId: services[0].id, minutes: String(services[0].duration_minutes) }] : []);
  const [staffId, setStaffId] = useState(staff[0] ? staff[0].id : "");
  const [time, setTime] = useState("10:00");
  const [saving, setSaving] = useState(false);

  function setItem(i, patch) { setItems(items.map((it, idx) => idx === i ? { ...it, ...patch } : it)); }
  function changeService(i, id) {
    const svc = services.find(s => s.id === id);
    setItem(i, svc ? { serviceId: id, minutes: String(svc.duration_minutes) } : { serviceId: id });
  }
  function addItem() {
    const used = new Set(items.map(it => it.serviceId));
    const next = services.find(s => !used.has(s.id)) || services[0];
    if (next) setItems([...items, { serviceId: next.id, minutes: String(next.duration_minutes) }]);
  }
  function removeItem(i) { setItems(items.filter((_, idx) => idx !== i)); }

  const totalMinutes = items.reduce((sum, it) => sum + (Number(it.minutes) || 0), 0);
  const endTime = time ? addMinutes(time, totalMinutes) : "";

  async function save() {
    if (!clientName.trim() || items.length === 0 || !time) { notify("Заповніть ім'я, послугу і час", true); return; }
    if (totalMinutes <= 0 || addMinutes(time, 0) >= "24:00" || endTime >= "24:00") { notify("Запис має закінчуватись до кінця дня. Змініть час або тривалість", true); return; }
    setSaving(true);
    let finalClientId = clientId;
    if (!finalClientId) {
      const { data: created, error } = await sb.from('clients').insert({ salon_id: SALON_ID, name: clientName.trim() }).select().single();
      if (error) { setSaving(false); notify(error.message, true); return; }
      finalClientId = created.id;
    }
    // Кожна послуга: окремий запис, один за одним (так само, як це робить бот)
    let cursor = time.slice(0, 5);
    const rows = items.map(it => {
      const dur = Number(it.minutes) || 60;
      const row = {
        salon_id: SALON_ID,
        client_id: finalClientId,
        service_id: it.serviceId,
        staff_id: soloMode ? (staff[0] ? staff[0].id : null) : staffId,
        date: selectedDate,
        time: cursor + ":00",
        duration_minutes: dur,
        status: 'scheduled',
        source: 'manual',
      };
      cursor = addMinutes(cursor, dur);
      return row;
    });
    const { error: bErr } = await sb.from('bookings').insert(rows);
    setSaving(false);
    if (bErr) return notify(bErr.message, true);
    onSaved();
  }

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="modal-head"><h3>Запис вручну — {formatDate(selectedDate)}</h3><button className="close" onClick={onClose}>✕</button></div>
        <div className="field">
          <label className="field-label">Клієнтка</label>
          <ClientAutocomplete clients={clients} value={clientName} onChange={v => { setClientName(v); setClientId(null); }} onPick={c => { setClientName(c.name); setClientId(c.id); }} />
        </div>
        <div className="field">
          <label className="field-label">{items.length > 1 ? "Послуги (по черзі)" : "Послуга"}</label>
          {items.map((it, i) => (
            <div className="svc-row" key={i}>
              <select value={it.serviceId} onChange={e => changeService(i, e.target.value)}>
                {services.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
              </select>
              <input className="svc-min" type="number" step="5" min="5" value={it.minutes} onChange={e => setItem(i, { minutes: e.target.value })} aria-label="Тривалість, хв" />
              {items.length > 1 && <button type="button" className="icon-btn" onClick={() => removeItem(i)} aria-label="Прибрати послугу">✕</button>}
            </div>
          ))}
          <button type="button" className="add-svc" onClick={addItem}>+ Додати ще послугу</button>
        </div>
        {!soloMode && staff.length > 0 && (
          <div className="field">
            <label className="field-label">Майстер</label>
            <select value={staffId} onChange={e => setStaffId(e.target.value)}>
              {staff.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
            </select>
          </div>
        )}
        <div className="field"><label className="field-label">Час початку</label><input type="time" value={time} onChange={e => setTime(e.target.value)} /></div>
        {items.length > 0 && time && <div className="total-line">Усього <b>{totalMinutes} хв</b>: з <b>{time}</b> до <b>{endTime}</b></div>}
        <div className="modal-actions">
          <button className="btn-secondary" onClick={onClose}>Скасувати</button>
          <button className="btn-primary" disabled={saving} onClick={save}>{saving ? "Зберігаю…" : "Додати в розклад"}</button>
        </div>
      </div>
    </div>
  );
}

function NewVisitModal({ client, services, onClose, onSaved, notify }) {
  const [date, setDate] = useState(todayIso());
  const [time, setTime] = useState("14:00");
  const [serviceId, setServiceId] = useState(services[0] ? services[0].id : "");
  const [description, setDescription] = useState("");
  const [materials, setMaterials] = useState("");
  const [saving, setSaving] = useState(false);

  async function save() {
    if (!serviceId || !date) { notify("Оберіть послугу і дату", true); return; }
    setSaving(true);
    const svc = services.find(s => s.id === serviceId);
    const { data: booking, error: bErr } = await sb.from('bookings').insert({
      salon_id: SALON_ID,
      client_id: client.id,
      service_id: serviceId,
      date,
      time: time.length === 5 ? time + ":00" : time,
      duration_minutes: svc ? svc.duration_minutes : 60,
      status: 'completed',
      source: 'manual',
    }).select().single();
    if (bErr) { setSaving(false); return notify(bErr.message, true); }
    if (description.trim() || materials.trim()) {
      const materialsArr = materials.split(",").map(m => m.trim()).filter(Boolean);
      const { error: vErr } = await sb.from('visit_records').insert({
        booking_id: booking.id,
        description: description.trim() || null,
        materials: materialsArr.length ? materialsArr : null,
      });
      if (vErr) { setSaving(false); return notify(vErr.message, true); }
    }
    setSaving(false);
    onSaved();
  }

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="modal-head"><h3>Новий запис візиту</h3><button className="close" onClick={onClose}>✕</button></div>
        <div className="row2">
          <div className="field"><label className="field-label">Дата</label><input type="date" value={date} onChange={e => setDate(e.target.value)} /></div>
          <div className="field"><label className="field-label">Час</label><input type="time" value={time} onChange={e => setTime(e.target.value)} /></div>
        </div>
        <div className="field">
          <label className="field-label">Послуга</label>
          <select value={serviceId} onChange={e => setServiceId(e.target.value)}>
            {services.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
          </select>
        </div>
        <div className="field"><label className="field-label">Опис процедури</label><textarea rows={3} placeholder="Деталі виконаної роботи…" value={description} onChange={e => setDescription(e.target.value)} /></div>
        <div className="field"><label className="field-label">Матеріали (через кому)</label><input placeholder="напр. Wella 8/1, Оксид 6%" value={materials} onChange={e => setMaterials(e.target.value)} /></div>
        <div className="modal-actions">
          <button className="btn-secondary" onClick={onClose}>Скасувати</button>
          <button className="btn-primary" disabled={saving} onClick={save}>{saving ? "Зберігаю…" : "Зберегти запис"}</button>
        </div>
      </div>
    </div>
  );
}

function ClientsView({ data, notify }) {
  const { clients, bookings, services } = data;
  const [query, setQuery] = useState("");
  const [selectedId, setSelectedId] = useState(null);
  const [showNewClient, setShowNewClient] = useState(false);
  const [showNewVisit, setShowNewVisit] = useState(false);
  const [newClientName, setNewClientName] = useState("");
  const [newClientPhone, setNewClientPhone] = useState("");
  const [visitRecords, setVisitRecords] = useState({});
  const [saving, setSaving] = useState(false);
  const [tipText, setTipText] = useState("");
  const [tips, setTips] = useState([]);
  const [tipSending, setTipSending] = useState(false);

  const filtered = clients.filter(c => (c.name || "").toLowerCase().includes(query.toLowerCase()));
  const selected = clients.find(c => c.id === selectedId) || filtered[0] || null;

  const clientVisits = useMemo(() => {
    if (!selected) return [];
    return bookings
      .filter(b => b.client_id === selected.id)
      .map(b => ({ ...b, serviceName: (services.find(s => s.id === b.service_id) || {}).name || "—" }))
      .sort((a, b) => (a.date + a.time < b.date + b.time ? 1 : -1));
  }, [selected, bookings, services]);

  useEffect(() => {
    let cancelled = false;
    async function loadRecords() {
      if (!clientVisits.length) return;
      const ids = clientVisits.map(v => v.id);
      const { data: rec, error } = await sb.from('visit_records').select('*').in('booking_id', ids);
      if (!cancelled && !error) {
        const map = {};
        (rec || []).forEach(r => { map[r.booking_id] = r; });
        setVisitRecords(map);
      }
    }
    loadRecords();
    return () => { cancelled = true; };
  }, [clientVisits]);

  async function loadTips() {
    if (!selected) { setTips([]); return; }
    const { data: rows, error } = await sb.from('recommendations').select('*').eq('client_id', selected.id).order('created_at', { ascending: false }).limit(10);
    if (!error) setTips(rows || []);
  }
  useEffect(() => { setTipText(""); loadTips(); }, [selected && selected.id]);

  async function sendTip() {
    if (!selected || !tipText.trim()) return;
    setTipSending(true);
    const { error } = await sb.from('recommendations').insert({ salon_id: SALON_ID, client_id: selected.id, text: tipText.trim(), source: 'dashboard' });
    setTipSending(false);
    if (error) return notify(error.message, true);
    setTipText("");
    notify("Рекомендації додано до черги. Клієнтка отримає їх протягом хвилини");
    loadTips();
  }

  async function addClient() {
    if (!newClientName.trim()) return;
    setSaving(true);
    const { data: created, error } = await sb.from('clients').insert({ salon_id: SALON_ID, name: newClientName.trim(), phone: newClientPhone.trim() || null }).select().single();
    setSaving(false);
    if (error) return notify(error.message, true);
    setNewClientName(""); setNewClientPhone(""); setShowNewClient(false);
    setSelectedId(created.id);
    notify("Клієнтку додано");
    data.reload();
  }

  return (
    <div className="clients-layout">
      <div className="sidebar">
        <div className="search-box"><span>🔍</span><input placeholder="Пошук клієнтки…" value={query} onChange={e => setQuery(e.target.value)} /></div>
        <div className="client-list">
          {filtered.map(c => (

                  </div>

                <div className="visit-desc" style={{ marginBottom: 0 }}>Ця клієнтка ще не підключена до бота, тому надіслати їй рекомендації в Telegram не вийде.</div>

                <div style={{ marginTop: 14 }}>

              return (
                <div className="visit" key={v.id}>

            <div className="field"><label className="field-label">Ім'я</label><input value={newClientName} onChange={e => setNewClientName(e.target.value)} /></div>

}

function WinbackView({ data, notify }) {
  const { winback, clients } = data;
  const [sentIds, setSentIds] = useState({});

  const candidates = winback
    .filter(w => w.last_visit_date && daysSince(w.last_visit_date) >= 30)
    .map(w => ({ ...w, client: clients.find(c => c.id === w.client_id) }))
    .filter(w => w.client)
    .sort((a, b) => daysSince(b.last_visit_date) - daysSince(a.last_visit_date));

  async function markSent(w) {
    const { error } = await sb.from('winback_reminders').insert({ client_id: w.client_id, status: 'sent', sent_at: new Date().toISOString() });
    if (error) return notify(error.message, true);
    setSentIds(s => ({ ...s, [w.client_id]: true }));
    notify("Позначено як надіслано");
  }

  return (
    <div className="main">
      <div className="card" style={{ marginBottom: 18 }}>
        <div style={{ fontSize: 13, color: "var(--ink-dim)" }}>
          Клієнтки, які не були в салоні 30+ днів. Саму розсилку нагадувань виконує автоматичний win-back сценарій за розкладом — тут ти бачиш список і можеш позначити, кому вже написала вручну.
        </div>
      </div>
      {candidates.length === 0 && <div className="empty">Наразі немає клієнток, які не були у салоні понад 30 днів.</div>}
      {candidates.map(w => {
        const days = daysSince(w.last_visit_date);
        const sent = sentIds[w.client_id];
        return (
          <div className="wb-card" key={w.client_id}>
            <div className="wb-avatar">{initialsOf(w.client.name)}</div>
            <div className="wb-body">
              <div className="wb-name">{w.client.name}</div>
              <div className="wb-meta">{days} днів без візиту · востаннє {formatDate(w.last_visit_date)}</div>
            </div>
            <button className="btn-secondary" style={sent ? { color: "var(--ok)", borderColor: "var(--ok)" } : {}} disabled={sent} onClick={() => markSent(w)}>
              {sent ? "✓ Позначено" : "Позначити надісланим"}
            </button>
          </div>
        );
      })}
    </div>
  );
}

function SettingsView({ data, notify }) {

  const [faq, setFaq] = useState(settings ? settings.faq || "" : "");
  const [workingHours, setWorkingHours] = useState(settings ? settings.working_hours || {} : {});
  const [buffer, setBuffer] = useState(settings ? String(settings.buffer_minutes) : "10");
  const [daysOff, setDaysOff] = useState(settings ? settings.days_off || [] : []);
  const [newDayOff, setNewDayOff] = useState("");

  useEffect(() => { if (salon) setSalonName(salon.name || ""); }, [salon]);
  useEffect(() => {
    if (settings) {
      setGreeting(settings.greeting || "");
      setFaq(settings.faq || "");
      setReminderTemplate(settings.reminder_template || "");
      setWorkingHours(settings.working_hours || {});
      setBuffer(String(settings.buffer_minutes));
      setDaysOff(settings.days_off || []);
    }
  }, [settings]);

  async function saveSalonInfo() {
    setSavingSection("salon");
    const { error } = await sb.from('salons').update({ name: salonName }).eq('id', SALON_ID);
    setSavingSection(null);
    if (error) return notify(error.message, true);
    notify("Дані салону збережено"); data.reload();

  async function saveBotTexts() {
    setSavingSection("texts");
    const { error } = await upsertSettings({ greeting, reminder_template: reminderTemplate, faq });
    setSavingSection(null);
    if (error) return notify(error.message, true);
    notify("Тексти бота збережено"); data.reload();
  }

  async function upsertSettings(fields) {
    // Якщо рядка налаштувань ще немає (новий салон), створюємо його. Інакше update нічого б не зберіг.
    const { data: existing, error: selErr } = await sb.from('salon_settings').select('salon_id').eq('salon_id', SALON_ID).maybeSingle();
    if (selErr) return { error: selErr };
    if (!existing) return sb.from('salon_settings').insert({ salon_id: SALON_ID, ...fields });
    return sb.from('salon_settings').update(fields).eq('salon_id', SALON_ID);
  }

  async function saveHours() {
    setSavingSection("hours");
    const { error } = await upsertSettings({ working_hours: workingHours, buffer_minutes: Number(buffer) || 10 });
    setSavingSection(null);
    if (error) return notify(error.message, true);
    notify("Графік роботи збережено"); data.reload();
  }

  function updateHour(day, field, value) {
    setWorkingHours(prev => ({ ...prev, [day]: { ...(prev[day] || {}), [field]: value } }));
  }

  async function addDayOffRow() {
    if (!newDayOff || daysOff.includes(newDayOff)) return;
    const updated = [...daysOff, newDayOff].sort();
    setSavingSection("daysoff");
    const { error } = await upsertSettings({ days_off: updated });
    setSavingSection(null);
    if (error) return notify(error.message, true);
    setDaysOff(updated); setNewDayOff(""); notify("Вихідний додано");
  }
  async function removeDayOffRow(d) {
    const updated = daysOff.filter(x => x !== d);
    setSavingSection("daysoff");
    const { error } = await upsertSettings({ days_off: updated });
    setSavingSection(null);
    if (error) return notify(error.message, true);
    setDaysOff(updated);
  }

  async function addService() {
    if (!newService.name.trim()) return;
    setSavingSection("services");
    const { error } = await sb.from('services').insert({
      salon_id: SALON_ID, name: newService.name.trim(),
      duration_minutes: Number(newService.duration_minutes) || 30,
      price: Number(newService.price) || 0, is_active: true,
    });
    setSavingSection(null);
    if (error) return notify(error.message, true);
    setNewService({ name: "", duration_minutes: "30", price: "" });
    notify("Послугу додано"); data.reload();
  }
  async function updateService(id, field, value) {
    const { error } = await sb.from('services').update({ [field]: value }).eq('id', id);
    if (error) return notify(error.message, true);
    data.reload();
  }
  async function removeService(id) {
    const { error } = await sb.from('services').delete().eq('id', id);
    if (error) return notify(error.message, true);
    notify("Послугу видалено"); data.reload();
  }

  async function addStaffMember() {
    if (!newStaff.name.trim() || staff.length >= 10) return;
    const used = staff.map(s => s.color);
    const color = staffColorPalette.find(c => !used.includes(c)) || staffColorPalette[staff.length % staffColorPalette.length];
    setSavingSection("staff");
    const { error } = await sb.from('staff').insert({
      salon_id: SALON_ID, name: newStaff.name.trim(), phone: newStaff.phone.trim() || null,
      role: newStaff.role.trim() || "Майстер", active: true, color,
    });
    setSavingSection(null);
    if (error) return notify(error.message, true);
    setNewStaff({ name: "", phone: "", role: "" });
    notify("Майстра додано"); data.reload();
  }

    if (error) return notify(error.message, true);
    data.reload();
  }
  async function removeStaffMember(id) {
    const { error } = await sb.from('staff').delete().eq('id', id);
    if (error) return notify(error.message, true);
    notify("Майстра видалено"); data.reload();
  }

  return (

      <div className="card">
        <h2>Ваш тариф</h2>
        <div className="row2">

          </div>

        </div>

      </div>

      <div className="card">

        <div className="field" style={{ marginBottom: 0 }}>
          <label className="field-label">Привітання бота</label>
          <textarea rows={2} value={greeting} onChange={e => setGreeting(e.target.value)} />

        <div className="field" style={{ marginTop: 12, marginBottom: 0 }}>

        </div>
        <div className="modal-actions" style={{ marginTop: 14 }}>

      <div className="card">

          <label className="field-label">Шаблон повідомлення (можна лишити {"{ім'я}"})</label>

        <div className="modal-actions" style={{ marginTop: 14 }}>
          <button className="btn-primary" disabled={savingSection === "texts"} onClick={saveBotTexts}>Зберегти</button>

          <input type="number" step="5" value={buffer} onChange={e => setBuffer(e.target.value)} style={{ width: 80 }} />
        </div>

          <button className="btn-primary" onClick={addDayOffRow}>Додати дату</button>
        </div>
      </div>
    </div>
  );
}

const CANCELLED_STATUSES = ['cancelled', 'canceled', 'no_show', 'noshow'];
function money(n) { return Math.round(Number(n) || 0).toLocaleString('uk-UA').replace(/\u00a0|\u202f/g, ' ') + " грн"; }
function isoOf(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }

function IncomeView({ data, notify, period, setPeriod }) {
  const { bookings, services, clients } = data;
  const today = todayIso();
  const nowHM = new Date().toTimeString().slice(0, 5);

  const range = useMemo(() => {
    const now = new Date(today + "T00:00:00");
    let from = new Date(now), to = new Date(now);
    if (period === "week") from.setDate(from.getDate() - 6);
    else if (period === "month") from = new Date(now.getFullYear(), now.getMonth(), 1);
    else if (period === "prev") { from = new Date(now.getFullYear(), now.getMonth() - 1, 1); to = new Date(now.getFullYear(), now.getMonth(), 0); }
    else from = new Date(now.getFullYear(), 0, 1);
    return { from: isoOf(from), to: isoOf(to) };
  }, [period, today]);

  const svcById = useMemo(() => Object.fromEntries(services.map(s => [s.id, s])), [services]);
  const cliById = useMemo(() => Object.fromEntries(clients.map(c => [c.id, c])), [clients]);

  function listPrice(b) { const s = svcById[b.service_id]; return s ? Number(s.price) || 0 : 0; }
  function hasPaid(b) { return b.price_paid !== null && b.price_paid !== undefined && b.price_paid !== ""; }
  function amountOf(b) { return hasPaid(b) ? Number(b.price_paid) || 0 : listPrice(b); }
  function isDone(b) {
    if (b.date < today) return true;
    if (b.date > today) return false;
    return addMinutes(String(b.time || "00:00").slice(0, 5), Number(b.duration_minutes) || 0) <= nowHM;
  }

  const inRange = bookings.filter(b => b.date >= range.from && b.date <= range.to);
  const lost = inRange.filter(b => CANCELLED_STATUSES.includes(b.status));
  const done = inRange.filter(b => !CANCELLED_STATUSES.includes(b.status) && isDone(b));

  const total = done.reduce((sum, b) => sum + amountOf(b), 0);
  const visitKeys = new Set(done.map(b => b.client_id + "|" + b.date));
  const visits = visitKeys.size;
  const avg = visits ? total / visits : 0;
  const lostSum = lost.reduce((sum, b) => sum + listPrice(b), 0);

  // стовпчики динаміки
  const buckets = [];
  if (period === "year") {
    for (let m = 0; m < 12; m++) buckets.push({ key: m, label: monthsShort[m], value: 0 });
    done.forEach(b => { buckets[Number(b.date.slice(5, 7)) - 1].value += amountOf(b); });
  } else {
    const d = new Date(range.from + "T00:00:00"), end = new Date(range.to + "T00:00:00");
    while (d <= end) { buckets.push({ key: isoOf(d), label: String(d.getDate()), value: 0 }); d.setDate(d.getDate() + 1); }
    const idx = Object.fromEntries(buckets.map((b, i) => [b.key, i]));
    done.forEach(b => { if (idx[b.date] !== undefined) buckets[idx[b.date]].value += amountOf(b); });
  }
  const barMax = Math.max(1, ...buckets.map(b => b.value));

  // топ послуг і клієнток
  const bySvc = {};
  done.forEach(b => {
    const s = svcById[b.service_id];
    const k = s ? s.name : "Без послуги";
    bySvc[k] = bySvc[k] || { name: k, count: 0, sum: 0 };
    bySvc[k].count += 1; bySvc[k].sum += amountOf(b);
  });
  const topSvc = Object.values(bySvc).sort((a, b) => b.sum - a.sum).slice(0, 5);

  const byCli = {};
  done.forEach(b => {
    const c = cliById[b.client_id];
    const k = b.client_id || "?";
    byCli[k] = byCli[k] || { name: c ? c.name : "Клієнтка", dates: new Set(), sum: 0 };
    byCli[k].dates.add(b.date); byCli[k].sum += amountOf(b);
  });
  const topCli = Object.values(byCli).sort((a, b) => b.sum - a.sum).slice(0, 5);

  const recent = done.slice().sort((a, b) => (b.date + (b.time || "")).localeCompare(a.date + (a.time || ""))).slice(0, 30);

  async function savePaid(b, raw) {
    const value = String(raw).trim();
    const v = value === "" ? null : Number(value);
    if (value !== "" && !(v >= 0)) return notify("Введіть суму числом", true);
    if (!hasPaid(b) && (v === null || v === listPrice(b))) return;
    if (hasPaid(b) && v === Number(b.price_paid)) return;
    const { error } = await sb.from('bookings').update({ price_paid: v }).eq('id', b.id);
    if (error) return notify(error.message, true);
    notify("Суму збережено");
    data.reload();
  }

  const periods = [["week", "7 днів"], ["month", "Цей місяць"], ["prev", "Минулий місяць"], ["year", "Рік"]];

  return (
    <div className="main">
      <div className="inc-seg">
        {periods.map(([id, label]) => <button key={id} className={period === id ? "on" : ""} onClick={() => setPeriod(id)}>{label}</button>)}
      </div>

      <div className="inc-stats">
        <div className="inc-stat big"><div className="l">Ви заробили</div><div className="v">{money(total)}</div></div>
        <div className="inc-stat"><div className="l">Візитів</div><div className="v">{visits}</div></div>
        <div className="inc-stat"><div className="l">Середній чек</div><div className="v">{money(avg)}</div></div>
        <div className="inc-stat big"><div className="l">Не відбулось (скасовано)</div><div className="v">{lost.length}</div>{lost.length > 0 && <div className="s">≈ {money(lostSum)} за прайсом</div>}</div>
      </div>

      {done.length === 0 ? (
        <div className="empty">За цей період ще немає завершених візитів.</div>
      ) : (
        <>
          <div className="card">
            <h2>Динаміка</h2>
            <div className="inc-bars">
              {buckets.map((b, i) => (
                <div className="bar-col" key={b.key} title={b.label + ": " + money(b.value)}>
                  <div className="bar-wrap"><div className={"bar" + (b.value === 0 ? " zero" : "")} style={{ height: Math.max(2, Math.round(b.value / barMax * 100)) + "%" }} /></div>
                  <div className="bar-l">{(buckets.length <= 12 || i % 5 === 0) ? b.label : ""}</div>
                </div>
              ))}
            </div>
          </div>

          <div className="card">
            <h2>Що приносить найбільше</h2>
            {topSvc.map(x => (
              <div className="inc-row" key={x.name}><div className="n">{x.name}<small>{x.count} шт.</small></div><div className="a">{money(x.sum)}</div></div>
            ))}
          </div>

          <div className="card">
            <h2>Найцінніші клієнтки</h2>
            {topCli.map((x, i) => (
              <div className="inc-row" key={i}><div className="n">{x.name}<small>{x.dates.size} візитів</small></div><div className="a">{money(x.sum)}</div></div>
            ))}
          </div>

          <div className="card">
            <h2>Фактична сума за візит</h2>
            <div style={{ fontSize: 12.5, color: "var(--ink-dim)", marginBottom: 8 }}>За замовчуванням беремо ціну з прайсу. Якщо клієнтка заплатила інакше (знижка, чайові), впишіть суму і вона врахується в доході.</div>
            {recent.map(b => {
              const c = cliById[b.client_id], s = svcById[b.service_id];
              return (
                <div className="inc-row" key={b.id + "-" + String(b.price_paid)}>
                  <div className="n">{c ? c.name : "Клієнтка"}<small>{formatDate(b.date)} · {s ? s.name : "без послуги"}{!hasPaid(b) ? " · за прайсом" : ""}</small></div>
                  <input type="number" min="0" step="10" defaultValue={amountOf(b)} onBlur={e => savePaid(b, e.target.value)} aria-label="Сума, грн" />
                </div>
              );
            })}
            <div className="inc-note">Візит вважається завершеним, коли його час минув. Скасовані записи в дохід не входять.</div>
          </div>
        </>
      )}
    </div>
  );
}

function MailingView({ data, notify }) {
  const { clients, bookings } = data;
  const [days, setDays] = useState("3");
  const [audience, setAudience] = useState("all");
  const [inactiveDays, setInactiveDays] = useState("30");
  const [confirm, setConfirm] = useState(false);
  const [saving, setSaving] = useState(false);
  const [history, setHistory] = useState(null);

  async function loadHistory() {
    const { data: rows, error } = await sb.from('mailings').select('*').order('created_at', { ascending: false }).limit(8);
    if (error) return notify(error.message, true);
    setHistory(rows || []);
  }
  useEffect(() => { loadHistory(); }, []);

  const today = todayIso();
  const reachable = clients.filter(c => c.telegram_chat_id);
  const recipients = useMemo(() => {
    if (audience === "all") return reachable;
    const n = Number(inactiveDays) || 30;
    const limit = new Date(today + "T00:00:00"); limit.setDate(limit.getDate() - n);
    const limIso = isoOf(limit);
    const active = new Set(bookings.filter(b => !CANCELLED_STATUSES.includes(b.status) && (b.date >= today || b.date > limIso)).map(b => b.client_id));
    return reachable.filter(c => !active.has(c.id));
  }, [audience, inactiveDays, clients, bookings, today]);

  const busy = (history || []).some(m => m.status === "pending" || m.status === "sending");

  async function send() {
    setSaving(true);
    const { error } = await sb.from('mailings').insert({
      salon_id: SALON_ID, days_ahead: Number(days) || 3, audience,
      inactive_days: audience === "inactive" ? (Number(inactiveDays) || 30) : null, status: 'pending'
    });
    setSaving(false); setConfirm(false);
    if (error) return notify(error.message, true);
    notify("Розсилку поставлено в чергу. Клієнтки отримають її протягом кількох хвилин");
    loadHistory();
  }

  const statusLabel = { pending: "в черзі", sending: "надсилається", done: "надіслано" };

  return (
    <div className="main">
      <div className="card">
        <h2>Розсилка вільних вікон</h2>
        <div style={{ fontSize: 12.5, color: "var(--ink-dim)", marginBottom: 12 }}>Бот напише клієнткам у Telegram, які вільні години є найближчими днями, і додасть кнопку «Записатись». Список вільних годин береться з вашого розкладу автоматично.</div>
        <div className="row2">
          <div className="field">
            <label className="field-label">На скільки днів уперед</label>
            <select value={days} onChange={e => setDays(e.target.value)}>
              {[1, 2, 3, 5, 7].map(n => <option key={n} value={n}>{n === 1 ? "Лише сьогодні" : n + " дн."}</option>)}
            </select>
          </div>
          <div className="field">
            <label className="field-label">Кому</label>
            <select value={audience} onChange={e => setAudience(e.target.value)}>
              <option value="all">Усім клієнткам у Telegram</option>
              <option value="inactive">Тим, хто давно не був</option>
            </select>
          </div>
        </div>
        {audience === "inactive" && (
          <div className="field">
            <label className="field-label">Не було понад (днів)</label>
            <input type="number" min="7" step="1" value={inactiveDays} onChange={e => setInactiveDays(e.target.value)} />
          </div>
        )}
        <div style={{ fontSize: 13, margin: "4px 0 12px" }}>Отримають: <b>{recipients.length}</b> {recipients.length === 1 ? "клієнтка" : "клієнток"}</div>
        {busy ? (
          <div className="banner">Попередня розсилка ще надсилається. Зачекайте кілька хвилин.</div>
        ) : confirm ? (
          <div className="row2">
            <button className="btn-secondary" onClick={() => setConfirm(false)}>Ні, назад</button>
            <button className="btn-primary" disabled={saving || recipients.length === 0} onClick={send}>{saving ? "Надсилаю…" : "Так, надіслати " + recipients.length}</button>
          </div>
        ) : (
          <button className="btn-primary" disabled={recipients.length === 0} onClick={() => setConfirm(true)}>Надіслати розсилку</button>
        )}
      </div>

      <div className="card">
        <h2>Попередні розсилки</h2>
        {history === null ? <div className="empty">Завантаження…</div> : history.length === 0 ? <div className="empty">Ще не було розсилок.</div> : history.map(m => (
          <div className="inc-row" key={m.id}>
            <div className="n">{formatDate(String(m.created_at).slice(0, 10))}<small>{m.days_ahead} дн. · {m.audience === "all" ? "усім" : "давно не були"}{m.status === "done" ? " · отримали: " + (m.sent_count ?? 0) : ""}</small></div>
            <div className="a" style={{ fontSize: 13 }}>{statusLabel[m.status] || m.status}</div>
          </div>
        ))}
        <button className="btn-secondary" style={{ marginTop: 10 }} onClick={loadHistory}>Оновити</button>
      </div>
    </div>
  );
}

function Dashboard({ onLogout }) {
  const [reloadKey, setReloadKey] = useState(0);
  const data = useSupabaseData(reloadKey);
  const fullData = { ...data, reload: () => setReloadKey(k => k + 1) };
  const [tab, setTab] = useState("calendar");
  const [incPeriod, setIncPeriod] = useState("month");
  const [message, setMessage] = useState({ text: null, error: false });

  const notify = useCallback((text, error) => {
    setMessage({ text, error: !!error });
    if (!error) setTimeout(() => setMessage(m => (m.text === text ? { text: null, error: false } : m)), 4000);
  }, []);

  const winbackCount = (data.winback || []).filter(w => w.last_visit_date && daysSince(w.last_visit_date) >= 30).length;

  const tabs = [
    { id: "calendar", label: "Календар" },
    { id: "clients", label: "Клієнти" },
    { id: "winback", label: "Нагадування", count: winbackCount },
    ...(data.salon && data.salon.plan === "premium" ? [{ id: "income", label: "Дохід" }, { id: "mailing", label: "Розсилка" }] : []),
    { id: "settings", label: "Налаштування" },
  ];

  return (
    <div className="app">
      <div className="topbar">
        <div className="brand">
          <div className="mark">Z</div>
          <div>
            <h1>ZavitAi</h1>
            <div className="sub">{data.salon ? data.salon.name : "Панель салону"}</div>
          </div>
        </div>
        <div className="tabs">
          {tabs.map(t => (
            <button key={t.id} className={"tab" + (tab === t.id ? " active" : "")} onClick={() => setTab(t.id)}>
              {t.label}{t.count > 0 && <span className="count">{t.count}</span>}
            </button>
          ))}
        </div>
        <button className="btn-secondary" onClick={onLogout}>Вийти</button>
      </div>

      <div className="content" style={{ flexDirection: "column" }}>
        {(message.text) && (
          <div style={{ padding: "0 22px" }}>
            <Banner error={message.error ? message.text : null} ok={!message.error ? message.text : null} onClear={() => setMessage({ text: null, error: false })} />
          </div>
        )}
        {data.loading ? (
          <div className="loading">Завантаження даних салону…</div>
        ) : data.error ? (
          <div className="main"><div className="banner error">Не вдалося завантажити дані: {data.error}</div></div>
        ) : (
          <>
            {tab === "calendar" && <CalendarView data={fullData} notify={notify} />}
            {tab === "clients" && <ClientsView data={fullData} notify={notify} />}
            {tab === "winback" && <WinbackView data={fullData} notify={notify} />}
            {tab === "income" && <IncomeView data={fullData} notify={notify} period={incPeriod} setPeriod={setIncPeriod} />}
            {tab === "mailing" && <MailingView data={fullData} notify={notify} />}
            {tab === "settings" && <SettingsView data={fullData} notify={notify} />}
          </>
        )}
      </div>
    </div>
  );
}

function Login({ onSignedIn }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);

  async function submit(e) {
    e.preventDefault();
    setBusy(true); setError(null);
    const { data, error } = await sb.auth.signInWithPassword({ email: email.trim(), password });
    setBusy(false);
    if (error) return setError("Не вдалося увійти. Перевірте пошту й пароль.");
    onSignedIn(data.session);
  }

  return (
    <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }}>
      <form className="card" style={{ width: 380, maxWidth: "100%", marginBottom: 0 }} onSubmit={submit}>
        <div className="brand" style={{ marginBottom: 18 }}>
          <div className="mark">Z</div>
          <div><h1>ZavitAi</h1><div className="sub">Вхід у панель салону</div></div>
        </div>
        {error && <div className="banner error">{error}</div>}
        <div className="field"><label className="field-label" htmlFor="em">Пошта</label>
          <input id="em" type="email" autoComplete="username" required value={email} onChange={e => setEmail(e.target.value)} /></div>
        <div className="field"><label className="field-label" htmlFor="pw">Пароль</label>
          <input id="pw" type="password" autoComplete="current-password" required value={password} onChange={e => setPassword(e.target.value)} /></div>
        <button className="btn-primary" style={{ width: "100%", justifyContent: "center" }} disabled={busy}>{busy ? "Входжу…" : "Увійти"}</button>
      </form>
    </div>
  );
}

function AuthGate() {
  const [state, setState] = useState({ status: "loading", error: null });

  const resolve = useCallback(async (session) => {
    if (!session) { SALON_ID = null; setState({ status: "out", error: null }); return; }
    const { data, error } = await sb.from('salon_users').select('salon_id').eq('user_id', session.user.id).maybeSingle();
    if (error || !data) { setState({ status: "noaccess", error: error ? error.message : null }); return; }
    SALON_ID = data.salon_id;
    setState({ status: "in", error: null });
  }, []);

  useEffect(() => {
    sb.auth.getSession().then(({ data }) => resolve(data.session));
    const { data: sub } = sb.auth.onAuthStateChange((event) => {
      if (event === "SIGNED_OUT") { SALON_ID = null; setState({ status: "out", error: null }); }
    });
    return () => sub.subscription.unsubscribe();
  }, [resolve]);

  async function logout() { await sb.auth.signOut(); }

  if (state.status === "loading") return <div className="loading">Завантаження…</div>;
  if (state.status === "out") return <Login onSignedIn={resolve} />;
  if (state.status === "noaccess") return (
    <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }}>
      <div className="card" style={{ width: 420, maxWidth: "100%" }}>
        <h2>Немає доступу до салону</h2>
        <p style={{ color: "var(--ink-dim)", fontSize: 14 }}>Ваш акаунт ще не прив'язаний до салону. Зверніться до підтримки.</p>
        {state.error && <div className="banner error">{state.error}</div>}
        <button className="btn-secondary" onClick={logout}>Вийти</button>
      </div>
    </div>
  );
  return <Dashboard onLogout={logout} />;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<AuthGate />);
</script>
